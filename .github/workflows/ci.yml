name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Test, package, and check coverage
        run: ./mvnw -B -ntp verify

      - name: Generate Javadoc
        run: ./mvnw -B -ntp javadoc:javadoc

      - name: Export OpenAPI specification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/openapi target/swagger-ui
          cleanup() {
            if [[ -n "${APP_PID:-}" ]]; then
              kill "${APP_PID}" 2>/dev/null || true
              wait "${APP_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          java -jar target/react-bff-gateway-*.jar \
            --spring.profiles.active=local \
            --server.port=8080 \
            > target/openapi/application.log 2>&1 &
          APP_PID=$!
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused \
            http://localhost:8080/v3/api-docs \
            --output target/openapi/openapi.json
          curl --fail --silent --show-error --retry 5 \
            http://localhost:8080/v3/api-docs.yaml \
            --output target/openapi/openapi.yaml
          curl --fail --silent --show-error --retry 5 \
            http://localhost:8080/swagger-ui/index.html \
            --output target/swagger-ui/index.html
          curl --fail --silent --show-error --retry 5 \
            http://localhost:8080/swagger-ui/swagger-ui.css \
            --output target/swagger-ui/swagger-ui.css
          curl --fail --silent --show-error --retry 5 \
            http://localhost:8080/swagger-ui/index.css \
            --output target/swagger-ui/index.css
          curl --fail --silent --show-error --retry 5 \
            http://localhost:8080/swagger-ui/swagger-ui-bundle.js \
            --output target/swagger-ui/swagger-ui-bundle.js
          curl --fail --silent --show-error --retry 5 \
            http://localhost:8080/swagger-ui/swagger-ui-standalone-preset.js \
            --output target/swagger-ui/swagger-ui-standalone-preset.js
          curl --fail --silent --show-error --retry 5 \
            http://localhost:8080/swagger-ui/favicon-32x32.png \
            --output target/swagger-ui/favicon-32x32.png
          curl --fail --silent --show-error --retry 5 \
            http://localhost:8080/swagger-ui/favicon-16x16.png \
            --output target/swagger-ui/favicon-16x16.png
          cat > target/swagger-ui/swagger-initializer.js <<'SWAGGER_UI'
          window.onload = function() {
            window.ui = SwaggerUIBundle({
              url: "../api/openapi.json",
              dom_id: "#swagger-ui",
              deepLinking: true,
              displayRequestDuration: true,
              persistAuthorization: true,
              operationsSorter: "alpha",
              tagsSorter: "alpha",
              presets: [
                SwaggerUIBundle.presets.apis,
                SwaggerUIStandalonePreset
              ],
              layout: "StandaloneLayout",
              validatorUrl: ""
            });
          };
          SWAGGER_UI

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Javadoc
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: javadoc
          path: target/site/apidocs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload OpenAPI specification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openapi-specification
          path: |
            target/openapi/openapi.json
            target/openapi/openapi.yaml
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare GitHub Pages content
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/pages/javadoc target/pages/coverage target/pages/api target/pages/swagger-ui
          cp -R target/site/apidocs/. target/pages/javadoc/
          cp -R target/site/jacoco/. target/pages/coverage/
          cp target/openapi/openapi.json target/pages/api/openapi.json
          cp target/openapi/openapi.yaml target/pages/api/openapi.yaml
          cp -R target/swagger-ui/. target/pages/swagger-ui/
          sed "s#__REPOSITORY__#${GITHUB_REPOSITORY}#g" .github/pages/index.html > target/pages/index.html

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/pages

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
