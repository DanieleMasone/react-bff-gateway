name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Validate Maven model
        run: ./mvnw -B -ntp validate

      - name: Test, package, and check coverage
        run: ./mvnw -B -ntp verify

      - name: Generate Javadoc
        run: ./mvnw -B -ntp javadoc:javadoc

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Javadoc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: target/site/apidocs
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare GitHub Pages content
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/pages/javadoc target/pages/coverage
          cp -R target/site/apidocs/. target/pages/javadoc/
          cp -R target/site/jacoco/. target/pages/coverage/
          cat > target/pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>React BFF Gateway Documentation</title>
            <style>
              :root {
                color-scheme: light dark;
                font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                line-height: 1.5;
              }
              body {
                margin: 0;
                color: #172033;
                background: #f6f7f9;
              }
              main {
                max-width: 920px;
                margin: 0 auto;
                padding: 56px 24px;
              }
              h1 {
                margin: 0 0 12px;
                font-size: 2.4rem;
              }
              p {
                max-width: 720px;
              }
              .links {
                display: grid;
                grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
                gap: 16px;
                margin-top: 32px;
              }
              a.card {
                display: block;
                padding: 20px;
                border: 1px solid #d9dee7;
                border-radius: 8px;
                color: inherit;
                background: #ffffff;
                text-decoration: none;
              }
              a.card strong {
                display: block;
                margin-bottom: 8px;
              }
              @media (prefers-color-scheme: dark) {
                body {
                  color: #eef2f7;
                  background: #111827;
                }
                a.card {
                  border-color: #374151;
                  background: #1f2937;
                }
              }
            </style>
          </head>
          <body>
            <main>
              <h1>React BFF Gateway</h1>
              <p>
                Production-oriented Spring Boot Backend for Frontend for a React application.
                The gateway secures frontend APIs with JWT, aggregates user and product services,
                applies circuit-breaker fallbacks, and exposes operational health endpoints.
              </p>
              <div class="links">
                <a class="card" href="./javadoc/">
                  <strong>Generated Javadoc</strong>
                  Public API documentation generated during CI.
                </a>
                <a class="card" href="./coverage/">
                  <strong>JaCoCo Coverage</strong>
                  HTML coverage report generated from the CI test run.
                </a>
                <a class="card" href="https://github.com/${{ github.repository }}">
                  <strong>GitHub Repository</strong>
                  Source code, workflow, Docker setup, and project README.
                </a>
              </div>
            </main>
          </body>
          </html>
          HTML

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/pages

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
