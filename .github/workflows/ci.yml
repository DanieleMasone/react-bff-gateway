name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Validate Maven model
        run: ./mvnw -B -ntp validate

      - name: Test, package, and check coverage
        run: ./mvnw -B -ntp verify

      - name: Generate Javadoc
        run: ./mvnw -B -ntp javadoc:javadoc

      - name: Export OpenAPI specification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/openapi
          cleanup() {
            if [[ -n "${APP_PID:-}" ]]; then
              kill "${APP_PID}" 2>/dev/null || true
              wait "${APP_PID}" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          java -jar target/react-bff-gateway-*.jar \
            --spring.profiles.active=local \
            --server.port=8080 \
            > target/openapi/application.log 2>&1 &
          APP_PID=$!
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused \
            http://localhost:8080/v3/api-docs \
            --output target/openapi/openapi.json
          curl --fail --silent --show-error --retry 5 \
            http://localhost:8080/v3/api-docs.yaml \
            --output target/openapi/openapi.yaml

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Javadoc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: target/site/apidocs
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload OpenAPI specification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-specification
          path: |
            target/openapi/openapi.json
            target/openapi/openapi.yaml
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare GitHub Pages content
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/pages/javadoc target/pages/coverage target/pages/api
          cp -R target/site/apidocs/. target/pages/javadoc/
          cp -R target/site/jacoco/. target/pages/coverage/
          cp target/openapi/openapi.json target/pages/api/openapi.json
          cp target/openapi/openapi.yaml target/pages/api/openapi.yaml
          sed "s#__REPOSITORY__#${GITHUB_REPOSITORY}#g" .github/pages/index.html > target/pages/index.html
          sed "s#__REPOSITORY__#${GITHUB_REPOSITORY}#g" .github/pages/api/index.html > target/pages/api/index.html
          curl --fail --location --silent --show-error --retry 3 \
            https://cdn.jsdelivr.net/npm/redoc@2.5.2/bundles/redoc.standalone.js \
            --output target/pages/api/redoc.standalone.js

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/pages

  deploy-pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
