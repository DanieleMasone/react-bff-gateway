services:
  bff:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      USER_SERVICE_BASE_URL: http://user-service:8080
      PRODUCT_SERVICE_BASE_URL: http://product-service:8080
      BFF_JWT_ISSUER: react-bff-gateway-local
      BFF_JWT_AUDIENCE: react-dashboard
      BFF_JWT_SECRET: local-development-secret-change-me-at-least-32-bytes
    depends_on:
      - user-service
      - product-service

  user-service:
    image: wiremock/wiremock:3.9.2
    ports:
      - "8081:8080"
    volumes:
      - ./docker/wiremock/user:/home/wiremock:ro

  product-service:
    image: wiremock/wiremock:3.9.2
    ports:
      - "8082:8080"
    volumes:
      - ./docker/wiremock/product:/home/wiremock:ro
