security:
  jwt:
    issuer: react-bff-gateway-test
    audience: react-dashboard
    secret: test-development-secret-change-me-at-least-32-bytes

downstream:
  user-service:
    base-url: http://localhost:8081
    timeout: 1s
  product-service:
    base-url: http://localhost:8082
    timeout: 1s

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-size: 2
        minimum-number-of-calls: 2
        wait-duration-in-open-state: 500ms
      productService:
        sliding-window-size: 2
        minimum-number-of-calls: 2
        wait-duration-in-open-state: 500ms
