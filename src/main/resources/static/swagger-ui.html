<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>React BFF Gateway Swagger UI</title>
  <link rel="stylesheet" href="/webjars/swagger-ui/swagger-ui.css">
  <style>
    body {
      margin: 0;
      background: #f7f8fb;
    }

    .topbar {
      display: none;
    }

    .swagger-ui .info {
      margin: 32px 0;
    }
  </style>
</head>
<body>
  <main id="swagger-ui" aria-label="Swagger UI API documentation"></main>
  <script src="/webjars/swagger-ui/swagger-ui-bundle.js"></script>
  <script src="/webjars/swagger-ui/swagger-ui-standalone-preset.js"></script>
  <script>
    window.addEventListener("load", function () {
      window.ui = SwaggerUIBundle({
        url: "/v3/api-docs",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        persistAuthorization: true,
        operationsSorter: "alpha",
        tagsSorter: "alpha",
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        layout: "StandaloneLayout"
      });
    });
  </script>
</body>
</html>
